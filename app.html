<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mossdesk</title>
  <meta name="description" content="Your local-first notes. Data never leaves this device." />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo" aria-label="Mossdesk home">
          <img src="logo.svg" alt="Mossdesk" class="logo-img logo-img--sm" width="120" height="48" />
        </a>
        <button id="btn-new" class="btn-icon" title="New note (⌘N)" aria-label="New note">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>

      <div class="search-wrap">
        <label for="search-input" class="sr-only">Search notes</label>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Search notes…"
          autocomplete="off"
        />
      </div>

      <div id="notes-list" class="notes-list" role="list"></div>

      <div class="sidebar-footer">
        <button id="btn-export" class="btn btn-ghost" title="Export all notes as JSON">Export</button>
        <button id="btn-clear" class="btn btn-ghost" title="Delete all notes">Clear</button>
      </div>
    </aside>

    <main class="editor-area">
      <div class="editor-toolbar">
        <button id="mobile-menu-btn" class="btn-icon mobile-menu-btn" aria-label="Open notes list">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>

        <div class="privacy-badge">Local only</div>

        <div class="editor-actions">
          <button class="theme-toggle" data-theme-toggle title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
          </button>
          <span id="editor-meta" class="editor-meta"></span>
          <button id="btn-delete" class="btn-icon" title="Delete this note" aria-label="Delete note" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
          </button>
        </div>
      </div>

      <div id="editor-empty" class="empty-editor">
        <h2>Your desk is clear</h2>
        <p>Create a note when something arrives. Everything stays on this device.</p>
        <button id="btn-new-empty" class="btn btn-primary" onclick="document.getElementById('btn-new').click()">
          Write a note
        </button>
      </div>

      <div id="editor-form" class="editor-body" hidden>
        <label for="note-title" class="sr-only">Note title</label>
        <input id="note-title" class="note-title-input" type="text" placeholder="Title" autocomplete="off" />
        <label for="note-content" class="sr-only">Note content</label>
        <textarea id="note-content" class="note-content" placeholder="Start writing…" spellcheck="true"></textarea>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
