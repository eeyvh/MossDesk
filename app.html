<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mossdesk</title>
  <meta name="description" content="Notas local-first. Seus pensamentos ficam neste dispositivo." />
  <meta name="theme-color" content="#5C7A6B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mossdesk" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&family=Lora:wght@400;600&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app notes-shell">
    <section id="home-view" class="home-view">
      <header class="home-header">
        <a href="index.html" class="home-logo" aria-label="Mossdesk">
          <img src="logo.svg" alt="Mossdesk" class="logo-img logo-img--sm" width="120" height="40" />
        </a>
        <div class="home-header-actions">
          <button id="btn-ai-home" class="pill-btn" title="Lichen" aria-label="Lichen">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09z" />
            </svg>
          </button>
          <button class="pill-btn theme-toggle" data-theme-toggle title="Tema" aria-label="Tema">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="home-search-wrap">
        <input id="search-input" class="home-search" type="search" placeholder="Buscar" autocomplete="off" />
      </div>

      <div id="home-empty" class="home-empty">
        <h1 class="home-empty-title">Sua mesa está limpa</h1>
        <p class="home-empty-text">Crie uma nota quando algo chegar.<br />Tudo permanece neste dispositivo.</p>
      </div>

      <div id="home-list" class="home-list" hidden></div>

      <div class="home-fab-wrap">
        <button id="btn-write" class="home-fab" type="button">Escreva algo</button>
      </div>
    </section>

    <section id="editor-view" class="editor-view" hidden>
      <header class="editor-topbar">
        <button id="btn-back" class="pill-btn" type="button" aria-label="Voltar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>
        <div class="editor-topbar-meta">
          <span class="privacy-dot" title="Somente local"></span>
          <span id="editor-meta" class="editor-meta-text"></span>
        </div>
        <div class="editor-topbar-actions">
          <button id="btn-ai" class="pill-btn" title="Lichen" aria-label="Lichen">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09z" />
            </svg>
          </button>
          <button id="btn-delete" class="pill-btn" title="Apagar" aria-label="Apagar" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
          </button>
        </div>
      </header>

      <div class="format-bar format-bar--notes" role="toolbar" aria-label="Formatação">
        <select id="font-select" class="pill-select" title="Fonte">
          <option value="Source Sans 3, system-ui, sans-serif">Sans</option>
          <option value="Fraunces, Georgia, serif">Fraunces</option>
          <option value="Lora, Georgia, serif">Lora</option>
          <option value="Merriweather, Georgia, serif">Merriweather</option>
          <option value="Playfair Display, Georgia, serif">Playfair</option>
          <option value="IBM Plex Sans, system-ui, sans-serif">Plex</option>
          <option value="Space Grotesk, system-ui, sans-serif">Grotesk</option>
          <option value="Georgia, serif">Georgia</option>
        </select>
        <input type="color" id="color-picker" class="pill-color" value="#2A2825" title="Cor" />
        <button type="button" id="btn-bold" class="pill-tool" title="Negrito"><strong>B</strong></button>
        <button type="button" id="btn-italic" class="pill-tool" title="Itálico"><em>I</em></button>
        <span class="pill-sep"></span>
        <select id="dictation-speak-lang" class="pill-select pill-select--sm" title="Idioma da fala">
          <option value="pt-BR">Falar PT</option>
          <option value="en-US">Falar EN</option>
          <option value="es-ES">Falar ES</option>
          <option value="de-DE">Falar DE</option>
          <option value="fr-FR">Falar FR</option>
        </select>
        <select id="dictation-write-lang" class="pill-select pill-select--sm" title="Idioma da escrita">
          <option value="pt">Escrever PT</option>
          <option value="en">Escrever EN</option>
          <option value="es">Escrever ES</option>
          <option value="de">Escrever DE</option>
          <option value="fr">Escrever FR</option>
        </select>
        <button type="button" id="btn-mic" class="pill-tool pill-tool--mic" title="Ditar">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
          </svg>
          <span id="mic-label">Ditar</span>
        </button>
      </div>

      <div class="editor-scroll">
        <input id="note-title" class="note-title-input" type="text" placeholder="Título" autocomplete="off" />
        <div
          id="note-content"
          class="note-content"
          contenteditable="true"
          role="textbox"
          aria-multiline="true"
          aria-label="Conteúdo"
          data-placeholder="Comece a escrever…"
        ></div>
      </div>
    </section>

    <aside id="ai-panel" class="ai-panel" aria-hidden="true">
      <div class="ai-panel-header">
        <div>
          <h2 class="ai-panel-title">Lichen</h2>
          <p class="ai-panel-sub">Companheiro calmo da sua mesa</p>
        </div>
        <button id="ai-close" class="pill-btn" aria-label="Fechar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="ai-lang-row">
        <label for="lichen-lang" class="ai-lang-label">Idioma</label>
        <select id="lichen-lang" class="pill-select">
          <option value="pt">Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
        </select>
      </div>
      <div class="ai-quick">
        <button type="button" class="ai-chip" data-action="summarize">Resumir</button>
        <button type="button" class="ai-chip" data-action="continue">Continuar</button>
        <button type="button" class="ai-chip" data-action="shorten">Encurtar</button>
        <button type="button" class="ai-chip" data-action="expand">Expandir</button>
        <button type="button" class="ai-chip" data-action="improve">Melhorar</button>
        <button type="button" class="ai-chip" data-action="outline">Estrutura</button>
        <button type="button" class="ai-chip" data-action="questions">Perguntas</button>
        <button type="button" class="ai-chip" data-action="research">Pesquisar</button>
      </div>
      <div id="ai-messages" class="ai-messages"></div>
      <div class="ai-input-row">
        <textarea id="ai-input" class="ai-input" rows="2" placeholder="Pergunte ao Lichen…"></textarea>
        <div class="ai-input-actions">
          <button type="button" id="ai-mic" class="pill-btn" aria-label="Falar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
            </svg>
          </button>
          <button type="button" id="ai-send" class="btn btn-primary ai-send">Enviar</button>
        </div>
      </div>
      <details class="ai-settings">
        <summary>API (opcional)</summary>
        <p class="ai-settings-help">Chave compatível com OpenAI. Só neste navegador.</p>
        <label class="ai-settings-label" for="ai-api-key">API key</label>
        <input id="ai-api-key" class="ai-settings-input" type="password" placeholder="sk-…" autocomplete="off" />
        <label class="ai-settings-label" for="ai-api-base">Base URL</label>
        <input id="ai-api-base" class="ai-settings-input" type="url" placeholder="https://api.openai.com/v1" autocomplete="off" />
        <label class="ai-settings-label" for="ai-api-model">Model</label>
        <input id="ai-api-model" class="ai-settings-input" type="text" placeholder="gpt-4o-mini" autocomplete="off" />
        <button type="button" id="ai-save-settings" class="btn btn-ghost ai-save-btn">Salvar</button>
        <p id="ai-settings-status" class="ai-settings-status"></p>
      </details>
      <p class="ai-privacy-note">Lichen funciona offline por padrão.</p>
    </aside>
    <div id="ai-overlay" class="ai-overlay" hidden></div>

    <button id="btn-new" type="button" hidden></button>
    <button id="btn-export" type="button" hidden></button>
    <button id="btn-clear" type="button" hidden></button>
    <div id="notes-list" hidden></div>
    <div id="sidebar" hidden></div>
    <div id="sidebar-overlay" hidden></div>
    <div id="editor-empty" hidden></div>
    <div id="editor-form" hidden></div>
    <button id="mobile-menu-btn" type="button" hidden></button>
  </div>
  <script src="app.js"></script>
</body>
</html>
